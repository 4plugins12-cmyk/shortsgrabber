
name: Build ShortsGrab (Windows)

on:
  push:
  workflow_dispatch:   # lets you click "Run workflow" to rebuild with the newest yt-dlp

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Works whether the files are at the top of the repo or inside a subfolder
      - name: Find the app folder
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter app.py | Where-Object { $_.FullName -notmatch '\\\.git\\' } | Select-Object -First 1
          if (-not $f) { Write-Error "app.py not found. Upload all the .py files from the ShortsGrab zip."; exit 1 }
          foreach ($need in "core.py","tags.py","tag_ui.py","twitch_ui.py","theme.py","video_tools.py","video_ui.py","audio_engine.py","audio_ui.py") {
            if (-not (Test-Path (Join-Path $f.DirectoryName $need))) { Write-Error "Missing $need next to app.py. Upload every file from the zip."; exit 1 }
          }
          "APPDIR=$($f.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "Building from $($f.DirectoryName)"

      - name: Install Python packages (always latest yt-dlp)
        working-directory: ${{ env.APPDIR }}
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" "customtkinter>=5.2" imageio-ffmpeg mutagen pillow numpy scipy sounddevice pyinstaller

      - name: Download ffmpeg + ffprobe
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin

      - name: Download Deno (needed for full-quality YouTube)
        working-directory: ${{ env.APPDIR }}
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin -Force

      - name: Build exe
        working-directory: ${{ env.APPDIR }}
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ShortsGrab
          --collect-data customtkinter
          --collect-all yt_dlp_ejs
          --collect-all sounddevice
          --collect-all _sounddevice_data
          --hidden-import scipy.signal
          --add-binary "bin/ffmpeg.exe;."
          --add-binary "bin/ffprobe.exe;."
          --add-binary "bin/deno.exe;."
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ShortsGrab-windows
          path: ${{ env.APPDIR }}/dist/ShortsGrab.exe
